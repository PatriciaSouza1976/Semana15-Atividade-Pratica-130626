<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meus Favoritos - Conheça BH</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS do projeto -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- =========================
       TOPO
  ========================== -->
  <header class="p-3 bg-light border-bottom d-flex justify-content-between align-items-center">

    <h4 class="m-0">❤️ Meus Favoritos</h4>

    <div id="areaUsuario"></div>

  </header>

  <!-- =========================
       CONTEÚDO
  ========================== -->
  <main class="container mt-4">

    <p class="text-center text-muted">
      Aqui estão os locais que você marcou como favoritos.
    </p>

    <div id="favoritosContainer" class="row mt-4"></div>

  </main>

  <!-- =========================
       SCRIPTS
  ========================== -->

  <script src="js/script.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const container = document.getElementById("favoritosContainer");
      const usuario = JSON.parse(sessionStorage.getItem("usuarioCorrente"));

      // =========================
      // BLOQUEIO SEM LOGIN
      // =========================
      if (!usuario) {
        container.innerHTML = `
          <div class="alert alert-warning text-center">
            Você precisa estar logado para ver seus favoritos.
          </div>
        `;
        return;
      }

      // =========================
      // GARANTE QUE OS LOCAIS EXISTEM
      // =========================
      const locais = window.getLocais ? window.getLocais() : [];

      // garante fallback seguro
      if (!Array.isArray(locais)) {
        container.innerHTML = "<p>Erro ao carregar locais.</p>";
        return;
      }

      // =========================
      // PEGA FAVORITOS DO USUÁRIO
      // =========================
      const dados = localStorage.getItem(`favoritos_${usuario.id}`);
      const favoritos = dados ? JSON.parse(dados) : [];

      // =========================
      // FILTRA FAVORITOS
      // =========================
      const filtrados = locais.filter(local =>
        favoritos.includes(local.id)
      );

      // =========================
      // SEM FAVORITOS
      // =========================
      if (filtrados.length === 0) {
        container.innerHTML = `
          <div class="text-center text-muted">
            Nenhum favorito adicionado ainda.
          </div>
        `;
        return;
      }

      // =========================
      // RENDER CORRETO
      // =========================
      container.innerHTML = filtrados.map(local => `
        <div class="col-md-4 mb-3">

          <div class="card shadow-sm h-100">

            <img src="${local.imagem}" class="card-img-top" alt="${local.nome}">

            <div class="card-body text-center">

              <h5 class="card-title">${local.nome}</h5>

              <p class="card-text text-muted">${local.descricao}</p>

              <p>📍 ${local.bairro || "Belo Horizonte"}</p>

              <button class="btn btn-danger btn-sm"
                onclick="toggleFavorito(${local.id})">
                Remover ❤️
              </button>

            </div>

          </div>

        </div>
      `).join("");

    });
  </script>

</body>

</html>
